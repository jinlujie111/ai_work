# 阿里云 Nginx · 学习者开发版
# 对外：https://instockdetail.com/ai_work/xuexi/
# 对内：127.0.0.1:7102
#
# 小程序 config.js：
#   apiBase: 'https://instockdetail.com/ai_work/xuexi'

upstream zhida_api_dev {
    server 127.0.0.1:7102;
    keepalive 16;
}

# 若站点已有 server { server_name instockdetail.com; ... }
# 只需把下面 location 块 include / 粘进该 server，不要重复 listen。

server {
    listen 80;
    server_name instockdetail.com;

    # 有 HTTPS 时建议 80 跳转 443（按你现有证书配置调整）
    # return 301 https://$host$request_uri;

    client_max_body_size 8m;

    location /ai_work/xuexi/ {
        proxy_pass http://zhida_api_dev/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        # 流式草案（NDJSON）勿缓冲
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }

    # 无尾斜杠时补上，避免 /ai_work/xuexi/health 与 /ai_work/xuexi 不一致
    location = /ai_work/xuexi {
        return 301 /ai_work/xuexi/;
    }
}

